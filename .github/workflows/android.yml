name: Android

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APKs and run unit tests
        run: ./gradlew assembleDebug assembleRelease testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: casper-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: casper-release
          path: app/build/outputs/apk/release/app-release.apk

  # Public download link that always points to the latest version:
  # https://github.com/<owner>/<repo>/releases/latest/download/casper.apk
  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: casper-release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv app-release.apk casper.apk
          gh release create "v${{ github.run_number }}" casper.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Casper ${{ github.run_number }}" \
            --notes "Installer : télécharger casper.apk sur le téléphone et l'ouvrir." \
            --latest

  emulator:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: casper-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: ./scripts/emulator-test.sh app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-results
          path: |
            capture.log
            screenshot.png
